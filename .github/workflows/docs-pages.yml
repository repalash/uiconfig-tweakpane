# The docs and examples moved to https://repalash.com/uiconfig.js/ (repository repalash/uiconfig.js).
# This site only serves redirect pages from the old URLs to the new ones (site-redirects/).
name: Deploy the redirect pages to github pages.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'site-redirects'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
